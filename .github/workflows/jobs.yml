name: Kera Jobs Automatic Scanner

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kera-jobs-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run vacancy scanner
        run: python automation/scanner.py

      - name: Publish verified jobs
        run: |
          if git diff --quiet -- data/verified_jobs.json; then
            echo "No changes to publish"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/verified_jobs.json
          git commit -m "Auto update verified vacancies"
          git push
